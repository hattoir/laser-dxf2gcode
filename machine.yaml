# 機械設定: Creality Falcon2 (GRBL 系ファーム)
#
# 各値の末尾コメントに【実測値】か【仮定値】かを明記する。
#   実測値 = 実機の `$$` 出力などで確認済み
#   仮定値 = 未確認。安全側に倒した暫定値。確認できたら値を直し、
#            下の `unverified:` リストから名前を消すこと。
#
# `unverified:` に名前が残っている間、convert の実行時と G-code の
# ヘッダコメントに「未確認の仮定値あり」の警告が出る。

machine:
  name: "Creality Falcon2"
  laser_power_w: 22          # 【実測値】本体ラベルで 22W を確認(2026-09-30)。表示用(計算には未使用)

  # --- 加工エリア -----------------------------------------------------
  # 0 <= X <= x_max, 0 <= Y <= y_max を 1 点でも外れたら G-code を出さずに異常終了する
  x_max: 400.0               # 【実測値】$130 = 400.000
  y_max: 415.0               # 【実測値】$131 = 415.000

  # --- レーザー出力 ---------------------------------------------------
  # S 値の最大 (= GRBL の $30)。出力 % はこれを 100% として S 値に換算する。
  # 実機が $30=1000 以外なら必ずここを直すこと。
  # 例) 実機 $30=1000 なのに ここを 255 にすると、100% 指定でも 25.5% しか出ない(安全側)
  #     実機 $30=255 なのに ここを 1000 にすると、25.5% 指定で全出力になる(危険側)
  s_max: 1000                # 【実測値】$30=1000.000(2026-09-30 $$ で確認)

  # --- 速度・加速度(所要時間の推定と送り速度の上限チェックに使う) ---
  max_rate_x: 25000.0        # 【実測値】$110 [mm/min]
  max_rate_y: 8000.0         # 【実測値】$111 [mm/min]
  accel_x: 1000.0            # 【実測値】$120=1000.000 [mm/s^2](2026-09-30 $$ で確認。当初の 500 は誤り)
  accel_y: 1000.0            # 【実測値】$121=1000.000 [mm/s^2](同上)
  junction_deviation: 0.01   # 【実測値】$11=0.010 [mm](2026-09-30 $$ で確認)。時間推定のみに使用

  # --- 原点復帰 -------------------------------------------------------
  # 冒頭の初期化と末尾の復帰で G0 する先。加工エリア内であること。
  park_x: 0.0                # 【仮定値】原点付近。機械原点の位置(手前左など)は要確認
  park_y: 0.0                # 【仮定値】同上
  return_home: true          # 【仮定値】末尾で park 位置へ戻るか(好みで変更可)

  # --- エアアシスト ---------------------------------------------------
  # M8/M9 で ON/OFF できるかは未確認。できないのに M8 を出しても GRBL は
  # クーラント扱いで無害だが、「出したつもり」になるのが危ないので既定は出さない。
  # 風量は $150/$151(1〜4)とノブで設定する前提。
  air_assist_gcode: false    # 【仮定値】M8/M9 制御の可否 未確認

unverified:
  - park_x
  - park_y
  - air_assist_gcode

# --- 2026-09-30 に $$ で確認した機械側の設定(記録。このツールは G-code で設定を変更しない) ---
#   $32=1   レーザーモード有効(M4 のダイナミックパワーが効く)          ← 必須。確認済み
#   $154=1  火焔警報 有効                                              ← 確認済み
#   $155=1  レンズ汚れ警報 有効                                        ← 確認済み
#   $153=0  気流低下警報 無効      → エアアシストを使うなら 1 を推奨
#   $20=0   ソフトリミット 無効    → ホーミング有効なので 1 にすると機械側でも範囲外を止められる
#   $21=1   ハードリミット 有効
#   $22=1   ホーミング 有効        → 流す前に必ずホーミング($H)すること
#   $23=3   ホーミング方向 X・Y とも反転(X・Y の最小側が原点)
#   $150=1 / $151=4  エアアシスト 最小/最大レベル
