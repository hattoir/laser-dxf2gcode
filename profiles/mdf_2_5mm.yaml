# 材料プロファイル: MDF 2.5mm(100均で購入)
#
# 各値の末尾コメントに【実測値】か【仮定値】かを明記する。
# ここにある値はすべて【仮定値】(22W 機・薄板の一般的な目安)。
# 買った板で必ずキャリブレーションしてから更新すること:
#   python dxf2gcode.py calibrate coupon -p mdf_2_5mm
#   python dxf2gcode.py calibrate kerf -p mdf_2_5mm --count 3
#
# 注意: 100均の板は表示と実際の厚さがずれることがある。ノギスで測って記録しておくこと。
# 実測の厚さ: 未測定
#
# 経緯: 2026-10-01 実機で 2 周・4 周では貫通しなかった(ユーザー報告)ため、切断を 6 周に変更。
#       周回を増やすと熱がこもるので、1 周ずつ全体を順に回り(cycle)、発振のたびに 2 秒冷ます。

mdf_2_5mm:
  kerf: 0.15                 # 【仮定値】薄い板ほど切り口の広がりが小さい想定。実測して更新すること

  default_layer: cut

  # コマンドで --pass-mode / --cooldown を指定しなければ、この値を使う
  pass_mode: cycle           # 全部の輪郭を 1 周ずつ順に回る(同じ輪郭を続けて焼かない)
  cooldown: 2                # 切断レベルの発振のたびに、レーザー OFF で 2 秒待つ

  layers:
    cut:
      power: 100             # 【仮定値】[%]
      feed: 400              # 【仮定値】[mm/min] 2026-10-01 500→400(条件一覧試験の最強マス 350×4 より強めにするため)
      passes: 6              # 【仮定値】2026-10-01 2→6(ユーザー指定。2 周・4 周では貫通しなかった)
      through_cut: true
      kerf_compensation: true
      order: 10
      air_assist: true
    engrave:
      power: 20              # 【仮定値】[%] 薄板は焦げやすいので 5mm 用より弱く
      feed: 3000             # 【仮定値】[mm/min]
      passes: 1              # 【仮定値】
      through_cut: false
      kerf_compensation: false
      order: 0
      air_assist: false
    score:                   # ケガキ線: 手で切るときの案内溝(貫通しない)。--mark-only で使う
      power: 40              # 【仮定値】[%]
      feed: 1500             # 【仮定値】[mm/min]
      passes: 1              # 【仮定値】
      through_cut: false
      kerf_compensation: false
      order: 1
      air_assist: true
