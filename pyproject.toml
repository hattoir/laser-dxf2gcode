[project]
name = "laser-dxf2gcode"
version = "0.1.0"
description = "Fusion 360 DXF -> GRBL G-code for Creality Falcon2 (kerf compensation, inside-out cut order, area check)"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.1", "pyclipper>=1.3", "PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
